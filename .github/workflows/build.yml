# build.yml -- the CI lane's entry (design D1/D2/D11). Based on PR #2 by
# huoyan1231 (thanks!) -- the vcpkg/CMake build steps he authored now live in
# build-core.yml, which this file dispatches; his authorship stays in this
# PR's history. Reworked per the maintainers' design: MANUAL-ONLY
# (workflow_dispatch; the nightly cron was deliberately dropped -- builds are
# human-paced), and a THIN entry so the CI lane and the release lane share ONE
# build implementation (remote form on purpose -- a local-path uses: would
# resolve from the triggering branch).
# KROFNE FORK (2133) PIN: build-core.yml is pinned to the b133 source SHA
# 2f32d1affb9bdf10447d9145c166b4832d1e449f (= tag v0.9.0n-b133-dev), NOT @main:
# upstream-main gates previously broke a correct b133 diagnostic build. The
# branch-local batch1-test-contract.yml is the payload lane; this file stays
# pinned for any diagnostic dispatch.
# Artifacts are CI evidence, NOT distribution -- releases are the supported
# install channel.
name: build

on:
  workflow_dispatch:
    inputs:
      cacheless:
        description: build without caches (the release-path smoke)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: VOTV-MP/Multivoid/.github/workflows/build-core.yml@2f32d1affb9bdf10447d9145c166b4832d1e449f # b133 pin (tag v0.9.0n-b133-dev); NEVER @main
    with:
      ref: ${{ github.sha }}
      source-sha: ${{ github.sha }}
      use-cache: ${{ !inputs.cacheless }}
